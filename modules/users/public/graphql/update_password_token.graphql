mutation update_password_token($id: ID!, $token: String!, $email: String!) {
  user_update(
    id: $id
    user: {
      email: $email
      profiles: [{ name: "default", values: { properties: [{ name: "password_token", value: $token }] } }]
    }
    form_configuration_name: "modules/users/update_password_token_form"
  ) {
    id
  }
}
